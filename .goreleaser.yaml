version: 2

project_name: pdu-agent

before:
  hooks:
    - go mod tidy

builds:
  - id: pdu-agent
    main: .
    binary: pdu-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

universal_binaries:
  - id: pdu-agent
    replace: true
    name_template: pdu-agent

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - pdu-agent.conf.example
      - systemd/pdu-agent.service
      - launchd/net.fedorov.pdu-agent.plist

checksum:
  name_template: "SHA256SUMS"

nfpms:
  - id: pdu-agent
    package_name: pdu-agent
    vendor: "Mihail Fedorov"
    homepage: https://github.com/kolobus/pdu-shutdown-agent
    maintainer: "Mihail Fedorov <mihail@fedorov.net>"
    description: |-
      Host-side agent that listens for the ATEN PE8208G shutdown broadcast
      on UDP :9000 and runs a configurable shell command (by default
      `shutdown -h now`) when the target MAC matches the local NIC. A
      clean-room replacement for ATEN's proprietary Safe Shutdown agent.
    license: MIT
    section: net
    priority: optional
    formats:
      - deb
      - rpm
      - apk
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    contents:
      - src: systemd/pdu-agent.service
        dst: /lib/systemd/system/pdu-agent.service
      - src: pdu-agent.conf.example
        dst: /etc/pdu-agent.conf.example
      - src: README.md
        dst: /usr/share/doc/pdu-agent/README.md
      - src: LICENSE
        dst: /usr/share/doc/pdu-agent/LICENSE
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
      postremove: scripts/postremove.sh

brews:
  - name: pdu-agent
    ids:
      - default
    repository:
      owner: kolobus
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "pdu-agent: bump to {{ .Tag }}"
    directory: Formula
    homepage: https://github.com/kolobus/pdu-shutdown-agent
    description: "Host-side agent for the ATEN PE8208G PDU shutdown broadcast."
    license: MIT
    install: |
      bin.install "pdu-agent"
      etc.install "pdu-agent.conf.example"
    service: |
      run [opt_bin/"pdu-agent", "-c", etc/"pdu-agent.conf"]
      keep_alive true
      run_type :immediate
      log_path var/"log/pdu-agent.log"
      error_log_path var/"log/pdu-agent.log"
      require_root true
    caveats: |
      pdu-agent needs root (to run /sbin/shutdown) and must run as a
      system-wide LaunchDaemon.

      1. Copy and edit the sample config. The NIC is typically "en0" on macOS:
           sudo cp #{etc}/pdu-agent.conf.example #{etc}/pdu-agent.conf
           sudo $EDITOR #{etc}/pdu-agent.conf

      2. Start the daemon:
           sudo brew services start pdu-agent

      Security note: macOS has no SO_BINDTODEVICE, so the socket listens
      on all interfaces. The source-IP filter (pdu_ip) is the only gate —
      keep PDU traffic on a trusted VLAN.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: kolobus
    name: pdu-shutdown-agent
  prerelease: auto
  draft: false
  header: |-
    ## Install

    ### Debian / Ubuntu
    ```bash
    wget https://github.com/kolobus/pdu-shutdown-agent/releases/download/{{ .Tag }}/pdu-agent_{{ .Version }}_linux_amd64.deb
    sudo apt install ./pdu-agent_{{ .Version }}_linux_amd64.deb
    sudo $EDITOR /etc/pdu-agent.conf   # copy from /etc/pdu-agent.conf.example
    sudo systemctl enable --now pdu-agent
    ```

    ### RHEL / Rocky / Fedora
    ```bash
    sudo rpm -i https://github.com/kolobus/pdu-shutdown-agent/releases/download/{{ .Tag }}/pdu-agent_{{ .Version }}_linux_amd64.rpm
    sudo systemctl enable --now pdu-agent
    ```

    ### Alpine
    ```bash
    wget https://github.com/kolobus/pdu-shutdown-agent/releases/download/{{ .Tag }}/pdu-agent_{{ .Version }}_linux_amd64.apk
    sudo apk add --allow-untrusted ./pdu-agent_{{ .Version }}_linux_amd64.apk
    ```

    ### Raw binary
    ```bash
    curl -L https://github.com/kolobus/pdu-shutdown-agent/releases/download/{{ .Tag }}/pdu-agent_{{ .Version }}_linux_amd64.tar.gz | sudo tar -xzC /usr/local/bin pdu-agent
    ```

    ### macOS (Homebrew)
    ```bash
    brew install kolobus/tap/pdu-agent
    sudo brew services start pdu-agent    # see `brew info pdu-agent` for config setup
    ```
